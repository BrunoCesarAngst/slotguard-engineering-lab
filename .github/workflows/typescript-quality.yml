name: TypeScript Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API client tests
        run: npm test

      - name: UI tests
        run: npm run test:ui

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install API dependencies
        run: python -m pip install -r ../python/requirements.txt

      - name: Integration test with Python API
        shell: bash
        run: |
          python -m uvicorn api:app \
            --app-dir ../python \
            --host 127.0.0.1 \
            --port 8000 \
            > "$RUNNER_TEMP/slotguard-api.log" 2>&1 &

          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for tentativa in {1..30}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "A API encerrou antes de ficar pronta."
              break
            fi

            if curl --fail --silent \
              --max-time 2 \
              http://127.0.0.1:8000/openapi.json \
              > /dev/null; then
              npm run test:integration
              exit 0
            fi

            sleep 1
          done

          echo "A API não ficou pronta dentro do limite."
          cat "$RUNNER_TEMP/slotguard-api.log"
          exit 1

      - name: Build publication image
        working-directory: .
        run: docker build -t slotguard:ci .

      - name: Test publication container
        working-directory: typescript
        shell: bash
        run: |
          encerrar() {
            resultado=$?

            if [[ "$resultado" -ne 0 ]]; then
              docker logs slotguard-ci || true
            fi

            docker rm -f slotguard-ci > /dev/null 2>&1 || true
          }

          trap encerrar EXIT

          docker run --detach \
            --name slotguard-ci \
            --publish 127.0.0.1:8000:10000 \
            --env PORT=10000 \
            slotguard:ci

          pronto=false

          for tentativa in {1..30}; do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8000/openapi.json \
              > /dev/null; then
              pronto=true
              break
            fi

            sleep 1
          done

          if [[ "$pronto" != true ]]; then
            echo "O contêiner não ficou pronto."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8000/ \
            | python -c 'import sys; assert "<title>SlotGuard</title>" in sys.stdin.read()'

          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8000/docs \
            > /dev/null

          npm run test:integration
